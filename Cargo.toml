[workspace]
members = [
    "crates/naxone-core",
    "crates/naxone-adapters",
    "crates/naxone-tauri",
]
resolver = "2"

[workspace.package]
version = "0.5.27"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工作区级 lint 统一：在 crate Cargo.toml 加 `[lints]\nworkspace = true` 即继承。
# 留个起点，后续要 deny 新的 lint 时改这里一处生效到全 crate。
[workspace.lints.rust]
unused_must_use = "warn"
unreachable_patterns = "warn"
